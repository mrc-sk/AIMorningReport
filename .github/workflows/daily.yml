name: Daily AI Morning Report

on:
  schedule:
    # 每日 23:00 UTC 生成，对应北京时间次日 07:00 可见最新晨报
    - cron: "0 23 * * *"
  workflow_dispatch: {}  # 支持手动触发

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate today's report skeleton
        run: python3 scripts/generate_report.py

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ai-morning-bot"
          git config user.email "ai-morning-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily report skeleton for $(date +%F)"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
          fi
